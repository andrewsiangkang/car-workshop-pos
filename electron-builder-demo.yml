# 【中文】演示版打包配置（完整副本）：appId / 名称 / 数据文件夹都与正式版不同，可同机安装、互不影响。
appId: com.workshop.pos.demo
productName: 修车店POS演示版
extraMetadata:
  workshopDemo: true
directories:
  output: dist
files:
  - electron/**/*
  - package.json
extraResources:
  - from: .next/standalone
    to: app-server
  - from: .next/static
    to: app-server/.next/static
  - from: public
    to: app-server/public
  - from: prisma/template.db
    to: template.db
win:
  target:
    - target: nsis
      arch: x64
  artifactName: "WorkshopPOS-DEMO-Setup-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
