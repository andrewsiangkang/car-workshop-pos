<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<!-- No scripts in the page: password-preload.js wires the form (sandboxed, isolated). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>备份密码 · Backup password</title>
<style>
  body { margin: 0; padding: 18px 20px; font: 14px/1.45 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; color: #0f172a; background: #fff; }
  p { margin: 0 0 10px; }
  .file { color: #475569; font-size: 12px; word-break: break-all; }
  input { box-sizing: border-box; width: 100%; padding: 8px 10px; font-size: 15px; border: 1px solid #cbd5e1; border-radius: 6px; }
  .row { margin-top: 14px; display: flex; justify-content: flex-end; gap: 8px; }
  button { padding: 7px 14px; font-size: 14px; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; }
  button.ok { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <p>输入这个加密备份的备份密码。<br>Enter the backup password of this encrypted backup.</p>
  <p class="file" id="file"></p>
  <input id="pw" type="password" maxlength="200" autofocus>
  <div class="row">
    <button type="button" id="cancel">取消 Cancel</button>
    <button type="submit" class="ok">确定 OK</button>
  </div>
</form>
</body>
</html>
